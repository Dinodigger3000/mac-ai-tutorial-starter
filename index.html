<!doctype html>
<html lang="en" data-theme="ocean" data-mode="system">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="A collection of games that works offline.">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="stylesheet" href="style.css">
    <script>
      try {
        const saved = JSON.parse(localStorage.getItem("game-collection:theme") || "{}");
        document.documentElement.dataset.theme = saved.theme || "ocean";
        document.documentElement.dataset.mode = saved.mode || "system";
      } catch (_) {}
    </script>
    <title>Playroom</title>
  </head>
  <body>
    <header class="app-header">
      <button id="back-button" class="icon-button hidden" aria-label="Back to games">←</button>
      <a class="brand" href="#/">Playroom</a>
      <div class="header-actions">
        <button id="theme-button" class="icon-button" aria-label="Open theme settings">⚙</button>
      </div>
    </header>
    <main id="app" class="app-main"></main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <dialog id="settings-dialog" aria-labelledby="settings-title">
      <form method="dialog" class="settings">
        <div class="dialog-heading">
          <h2 id="settings-title">Settings</h2>
          <button class="icon-button" value="cancel" aria-label="Close settings">×</button>
        </div>
        <label>Color theme
          <select id="theme-select">
            <option value="classic">Classic</option>
            <option value="ocean">Ocean</option>
            <option value="forest">Forest</option>
            <option value="sunset">Sunset</option>
            <option value="mono">Mono</option>
          </select>
        </label>
        <label>Mode
          <select id="mode-select">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
            <option value="system">Follow system</option>
          </select>
        </label>
        <button id="reset-button" class="text-button" type="button">Reset saved data</button>
      </form>
    </dialog>
    <script type="module" src="app.js"></script>
  </body>
</html>
